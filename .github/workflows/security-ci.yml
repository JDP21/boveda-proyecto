name: security-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secretos en todo el historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Servidor (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  client:
    name: Cliente (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # Se omite hasta que exista el proyecto Vite (client/package.json)
      - uses: actions/setup-node@v4
        if: hashFiles('client/package.json') != ''
        with:
          node-version: "20"
      - if: hashFiles('client/package.json') != ''
        run: npm ci
      - if: hashFiles('client/package.json') != ''
        run: npm run lint --if-present
      - if: hashFiles('client/package.json') != ''
        run: npm run build
