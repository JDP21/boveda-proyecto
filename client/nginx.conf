server {
    listen 80;
    server_name localhost;
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # Solo recursos propios; 'wasm-unsafe-eval' es necesario para Argon2id en WebAssembly
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # SPA de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API en el mismo origen: /api/... -> vault-api-server
    location /api/ {
        proxy_pass http://server:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
