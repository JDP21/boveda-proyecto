server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (a nivel server para que Nginx las herede en todos los location)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # SPA de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API en el mismo origen: /api/... -> vault-api-server
    location /api/ {
        proxy_pass http://server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Transmite archivos cifrados grandes directo a FastAPI sin escribir temporales en Nginx
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}